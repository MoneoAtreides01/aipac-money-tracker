name: Debug

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options:
          - debug
          - api --dry-run
        default: debug

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python refresh.py ${{ inputs.command }}
