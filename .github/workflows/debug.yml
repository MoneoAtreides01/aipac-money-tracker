name: Debug FEC shapes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dump record shapes
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python refresh.py debug
